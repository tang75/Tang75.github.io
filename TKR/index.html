<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Knee Passport">
<meta name="theme-color" content="#EFF2EE">
<meta name="robots" content="noindex, nofollow">
</head>
<body>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Right Knee Passport</title>
<style>
/* ============ TOKENS: light is the base; both dark states override tokens only ============ */
:root{
  --paper:#EFF2EE;        /* pale green-biased paper — surgical drape, not cream */
  --card:#FBFCFA;
  --card-2:#F5F8F4;
  --ink:#161E1A;
  --ink-2:#4E5C55;
  --ink-3:#5C6A63;
  --rule:#D8DFD8;
  --rule-2:#C3CDC4;
  --accent:#0E5C4A;       /* deep surgical teal */
  --accent-soft:#DCEAE3;
  --accent-ink:#0A4739;
  --on-accent:#F4F8F5;
  --on-warn:#FFFFFF;
  --pen:#2C4FA8;          /* the blue ballpoint in the scans — semantic: handwritten */
  --pen-soft:#E4E9F6;
  --mine:#63409B;         /* semantic: a task she typed herself, not from any document */
  --mine-soft:#EEE7F8;
  --warn:#8F5407;
  --warn-soft:#F7EBD8;
  --warn-rule:#DFBE8A;
  --crit:#9C2A20;
  --crit-soft:#F8E4E1;
  --crit-rule:#E0A9A2;
  --shadow:0 1px 2px rgba(22,30,26,.06), 0 6px 20px -12px rgba(22,30,26,.22);
  --shadow-lift:0 2px 4px rgba(22,30,26,.08), 0 14px 34px -16px rgba(22,30,26,.3);

  --f-display:"Avenir Next","Avenir","Segoe UI Semibold",ui-sans-serif,system-ui,sans-serif;
  --f-body:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-hand:"Bradley Hand","Chalkboard SE","Segoe Script","Comic Sans MS",cursive;
  --f-data:ui-monospace,"SF Mono","Menlo","Cascadia Mono","Roboto Mono",monospace;

  --wrap:41rem;
  --tabbar:4.25rem;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#0F1512; --card:#171F1B; --card-2:#1D2723;
    --ink:#E3EAE5; --ink-2:#A3B1AA; --ink-3:#8A9891;
    --rule:#28332D; --rule-2:#37453D;
    --accent:#54C3A3; --accent-soft:#12332A; --accent-ink:#8FE0C5;
    --on-accent:#08130F; --on-warn:#1A1206;
    --pen:#8CA8F0; --pen-soft:#18213A;
    --mine:#C0A6EE; --mine-soft:#241B38;
    --warn:#E5AC63; --warn-soft:#2E2313; --warn-rule:#5C4522;
    --crit:#F08A7C; --crit-soft:#331714; --crit-rule:#63302A;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 6px 20px -12px rgba(0,0,0,.8);
    --shadow-lift:0 2px 4px rgba(0,0,0,.5), 0 14px 34px -16px rgba(0,0,0,.9);
  }
}
:root[data-theme="dark"]{
  --paper:#0F1512; --card:#171F1B; --card-2:#1D2723;
  --ink:#E3EAE5; --ink-2:#A3B1AA; --ink-3:#8A9891;
  --rule:#28332D; --rule-2:#37453D;
  --accent:#54C3A3; --accent-soft:#12332A; --accent-ink:#8FE0C5;
  --on-accent:#08130F; --on-warn:#1A1206;
  --pen:#8CA8F0; --pen-soft:#18213A;
  --mine:#C0A6EE; --mine-soft:#241B38;
  --warn:#E5AC63; --warn-soft:#2E2313; --warn-rule:#5C4522;
  --crit:#F08A7C; --crit-soft:#331714; --crit-rule:#63302A;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 6px 20px -12px rgba(0,0,0,.8);
  --shadow-lift:0 2px 4px rgba(0,0,0,.5), 0 14px 34px -16px rgba(0,0,0,.9);
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:var(--f-body); font-size:16px; line-height:1.5;
  -webkit-text-size-adjust:100%; -webkit-font-smoothing:antialiased;
  padding-bottom:calc(var(--tabbar) + env(safe-area-inset-bottom,0px) + 1rem);
}
h1,h2,h3,h4{font-family:var(--f-display); font-weight:600; text-wrap:balance; margin:0; letter-spacing:-.012em}
p{margin:0}
a{color:var(--accent-ink); text-decoration-color:color-mix(in srgb, var(--accent) 40%, transparent); text-underline-offset:2px}
:focus-visible{outline:2.5px solid var(--accent); outline-offset:2px; border-radius:4px}
@media (prefers-reduced-motion:reduce){*{animation:none !important; transition:none !important; scroll-behavior:auto !important}}

.wrap{max-width:var(--wrap); margin:0 auto; padding:0 1rem}

/* ============ HEADER ============ */
header{position:sticky; top:0; z-index:40; background:var(--paper); border-bottom:1px solid var(--rule); padding-top:env(safe-area-inset-top,0px)}
.hd{display:flex; align-items:baseline; gap:.6rem; padding:.7rem 0 .1rem}
.hd h1{font-size:1.02rem; letter-spacing:-.01em; flex:1; min-width:0}
.hd h1 span{color:var(--ink-3); font-weight:500}
.count{font-family:var(--f-display); font-size:2.5rem; font-weight:700; line-height:1; letter-spacing:-.045em; color:var(--accent-ink); font-variant-numeric:tabular-nums}
.count small{font-size:.95rem; font-weight:600; letter-spacing:0; color:var(--ink-2); margin-left:.15rem}
.countline{display:flex; align-items:flex-end; justify-content:space-between; gap:1rem; padding-bottom:.55rem}
.countline .meta{text-align:right; font-family:var(--f-data); font-size:.7rem; color:var(--ink-3); line-height:1.5; letter-spacing:.02em}
.countline .meta b{color:var(--ink-2); font-weight:600}
.rail{height:5px; border-radius:99px; background:var(--rule); position:relative; margin-bottom:.5rem}
.rail i{position:absolute; inset-block:0; left:0; background:var(--accent); border-radius:99px; display:block}
.rail b{position:absolute; top:50%; width:11px; height:11px; border-radius:50%; background:var(--accent); border:2.5px solid var(--paper); transform:translate(-50%,-50%)}
.rail u{position:absolute; top:50%; width:3px; height:11px; background:var(--ink-3); transform:translate(-50%,-50%); border-radius:2px; opacity:.55}
.chips{display:flex; gap:.35rem; overflow-x:auto; padding:0 1rem .55rem; scrollbar-width:none; -webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto; font-family:var(--f-data); font-size:.685rem; letter-spacing:.02em; padding:.32rem .58rem; border-radius:99px; border:1px solid var(--rule-2); background:var(--card); color:var(--ink-2); cursor:pointer; white-space:nowrap; font-weight:500; transition:background .15s, color .15s, border-color .15s}
.chip[data-state="done"]{color:var(--ink-3); border-color:var(--rule)}
.chip[data-state="now"]{background:var(--accent); border-color:var(--accent); color:var(--on-accent); font-weight:700}
.chip:hover{border-color:var(--accent)}
.chip.sel{background:var(--accent-soft); border-color:var(--accent); color:var(--accent-ink); font-weight:700}
.chip.sel[data-state="now"]{background:var(--accent); color:var(--on-accent)}
/* once she picks a phase, that is the highlight — the current phase steps back
   to an outline so there are never two things claiming to be "where you are" */
.chips.has-sel .chip[data-state="now"]:not(.sel){
  background:var(--card); color:var(--ink-2); border-color:var(--accent); font-weight:600}

.panel{display:none; padding-top:1.15rem}
.panel.on{display:block}

/* ============ PHASE CARDS ============ */
.phases{display:flex; flex-direction:column; gap:.7rem}
.phase{background:var(--card); border:1px solid var(--rule); border-radius:14px; box-shadow:var(--shadow); overflow:hidden; scroll-margin-top:11rem}
.phase[data-state="now"]{border-color:var(--accent); box-shadow:var(--shadow-lift)}
.phase[data-state="past"]{opacity:.72}
.ph-head{display:flex; align-items:flex-start; gap:.75rem; width:100%; text-align:left; padding:.95rem 1rem; background:none; border:0; cursor:pointer; font:inherit; color:inherit}
.dot{flex:0 0 auto; width:.72rem; height:.72rem; border-radius:50%; margin-top:.4rem; border:2px solid var(--rule-2); background:var(--card)}
.phase[data-state="now"] .dot{background:var(--accent); border-color:var(--accent); box-shadow:0 0 0 4px var(--accent-soft)}
.phase[data-state="past"] .dot{background:var(--rule-2); border-color:var(--rule-2)}
.ph-t{flex:1; min-width:0}
.ph-t h2{font-size:1.02rem; line-height:1.28}
.ph-when{font-family:var(--f-data); font-size:.7rem; color:var(--ink-3); letter-spacing:.035em; text-transform:uppercase; margin-top:.2rem}
.phase[data-state="now"] .ph-when{color:var(--accent-ink); font-weight:700}
.ph-r{flex:0 0 auto; display:flex; align-items:center; gap:.5rem; margin-top:.15rem}
.tally{font-family:var(--f-data); font-size:.72rem; color:var(--ink-3); font-variant-numeric:tabular-nums}
.tally.full{color:var(--accent-ink); font-weight:700}
.caret{width:.85rem; height:.85rem; color:var(--ink-3); transition:transform .2s}
.phase[data-open="1"] .caret{transform:rotate(180deg)}
.ph-body{padding:0 1rem 1rem; border-top:1px solid var(--rule)}
.phase[data-open="0"] .ph-body{display:none}
.ph-blurb{font-size:.875rem; color:var(--ink-2); padding:.75rem 0 .1rem; line-height:1.5}

/* ============ TASK ROWS ============ */
ul.items{list-style:none; margin:.5rem 0 0; padding:0; display:flex; flex-direction:column}
li.item{border-top:1px solid var(--rule); padding:.1rem 0}
li.item:first-child{border-top:0}
.row{display:flex; gap:.7rem; align-items:flex-start; width:100%; padding:.62rem 0; text-align:left; background:none; border:0; font:inherit; color:inherit; cursor:pointer; min-height:2.75rem}
.box{flex:0 0 auto; width:1.32rem; height:1.32rem; border-radius:6px; margin-top:.09rem; border:1.8px solid var(--rule-2); background:var(--card-2); display:grid; place-items:center; transition:background .14s, border-color .14s}
.box svg{width:.82rem; height:.82rem; color:var(--on-accent); opacity:0; transform:scale(.6); transition:opacity .14s, transform .14s}
.item.done .box{background:var(--accent); border-color:var(--accent)}
.item.done .box svg{opacity:1; transform:scale(1)}
.txt{flex:1; min-width:0; font-size:.925rem; line-height:1.45}
.item.done .txt{color:var(--ink-3); text-decoration:line-through; text-decoration-color:var(--rule-2)}
.item.info .row{cursor:default}
.item.info .box{border:0; background:none; position:relative}
.item.info .box::after{content:""; width:5px; height:5px; border-radius:50%; background:var(--ink-3)}
.sub{display:block; font-size:.8rem; color:var(--ink-2); margin-top:.25rem; line-height:1.45}
.when-tag{display:inline-block; font-family:var(--f-data); font-size:.66rem; letter-spacing:.03em; color:var(--accent-ink); background:var(--accent-soft); padding:.09rem .38rem; border-radius:4px; margin-right:.35rem; vertical-align:1px; font-weight:600; white-space:nowrap}
.src{display:inline; font-family:var(--f-data); font-size:.62rem; color:var(--ink-3); letter-spacing:.05em; margin-left:.3rem; white-space:nowrap}

/* ============ HANDWRITTEN MARGINALIA ============ */
.hand{margin:.3rem 0 .55rem; padding:.5rem .7rem .55rem; border-left:2.5px solid var(--pen); background:var(--pen-soft); border-radius:0 8px 8px 0; transform:rotate(-.35deg)}
.hand .lbl{display:block; font-family:var(--f-data); font-size:.6rem; letter-spacing:.09em; text-transform:uppercase; color:var(--pen); margin-bottom:.12rem; font-weight:600}
.hand q{font-family:var(--f-hand); font-size:1.02rem; color:var(--pen); line-height:1.4; quotes:'"' '"'}

/* ============ CONFLICT DISCLOSURE ============ */
details.cf{margin:.35rem 0 .55rem; border:1px solid var(--warn-rule); background:var(--warn-soft); border-radius:9px}
details.cf > summary{list-style:none; cursor:pointer; padding:.5rem .65rem; display:flex; gap:.5rem; align-items:flex-start; font-size:.8rem; color:var(--warn); font-weight:600; line-height:1.4}
details.cf > summary::-webkit-details-marker{display:none}
details.cf > summary::after{content:"›"; margin-left:auto; font-size:1.1rem; line-height:1; transition:transform .2s; color:var(--warn); padding-left:.3rem}
details.cf[open] > summary::after{transform:rotate(90deg)}
.cf-tri{flex:0 0 auto; width:.95rem; height:.95rem; margin-top:.08rem}
.cf-body{padding:0 .65rem .6rem 2.1rem; display:flex; flex-direction:column; gap:.5rem}
.cf-why{font-size:.79rem; color:var(--ink-2); line-height:1.45}
.cf-opt{border-left:2px solid var(--warn-rule); padding-left:.6rem; font-size:.815rem; line-height:1.45; color:var(--ink)}
.cf-opt.pick{border-left-color:var(--accent); border-left-width:3px}
.cf-opt b{display:block; font-family:var(--f-data); font-size:.62rem; letter-spacing:.05em; color:var(--warn); font-weight:700; margin-bottom:.1rem}
.cf-opt.pick b{color:var(--accent-ink)}
.cf-opt i{display:block; font-style:normal; color:var(--ink-3); font-size:.75rem; margin-top:.15rem}
.follow{display:inline-block; font-family:var(--f-data); font-size:.58rem; letter-spacing:.06em; text-transform:uppercase; background:var(--accent); color:var(--on-accent); padding:.1rem .34rem; border-radius:4px; margin-left:.35rem; font-weight:700; vertical-align:1px}
.cf-rule{font-size:.775rem; line-height:1.45; color:var(--ink); background:var(--accent-soft); border-radius:7px; padding:.45rem .6rem}
.cf-rule b{color:var(--accent-ink)}
.pickline{display:block; margin-top:.2rem; font-weight:700; color:var(--accent-ink); font-size:.79rem}
.pickline.open{color:var(--warn)}

/* ============ DAILY TRACKER ============ */
.day{background:var(--card); border:1px solid var(--rule); border-radius:14px; box-shadow:var(--shadow); margin-bottom:.7rem; overflow:hidden}
.day[data-state="now"]{border-color:var(--accent); box-shadow:var(--shadow-lift)}
.day-h{display:flex; align-items:baseline; gap:.6rem; padding:.8rem 1rem .6rem; border-bottom:1px solid var(--rule)}
.day-h h3{font-size:.97rem; flex:1}
.day-h .dnum{font-family:var(--f-data); font-size:.66rem; color:var(--ink-3); letter-spacing:.04em; text-transform:uppercase}
.grp{padding:.7rem 1rem .2rem}
.grp + .grp{border-top:1px solid var(--rule)}
.trow{padding:.5rem 0 .7rem}
.trow + .trow{border-top:1px solid var(--rule)}
.trow-h{display:flex; align-items:baseline; gap:.45rem; flex-wrap:wrap}
.trow-h b{font-size:.9rem; font-weight:600}
.trow-h .prn{font-family:var(--f-data); font-size:.6rem; letter-spacing:.05em; text-transform:uppercase; color:var(--warn); background:var(--warn-soft); border-radius:4px; padding:.06rem .3rem; font-weight:700}
.trow p{font-size:.785rem; color:var(--ink-2); line-height:1.45; margin-top:.2rem}
.slots{display:flex; flex-wrap:wrap; gap:.4rem; margin-top:.5rem}
.slot{width:2.15rem; height:2.15rem; border-radius:8px; border:1.8px solid var(--rule-2); background:var(--card-2); cursor:pointer; display:grid; place-items:center; font:inherit; font-family:var(--f-data); font-size:.68rem; color:var(--ink-3); font-weight:600; padding:0; transition:background .14s, border-color .14s, color .14s}
.slot[aria-checked="true"]{background:var(--accent); border-color:var(--accent); color:var(--on-accent)}
.slot.prn[aria-checked="true"]{background:var(--warn); border-color:var(--warn); color:var(--on-warn)}
.slot:hover{border-color:var(--accent)}
/* recorded dose times */
.dts{display:flex; flex-wrap:wrap; gap:.35rem; margin-top:.5rem}
.dt{display:inline-flex; align-items:center; gap:.3rem; background:var(--accent-soft); border:1px solid var(--accent);
  border-radius:8px; padding:.2rem .4rem .2rem .5rem; min-height:2.4rem}
.dt span{font-family:var(--f-data); font-size:.64rem; font-weight:700; color:var(--accent-ink); letter-spacing:.03em}
.dt input{font:inherit; font-family:var(--f-data); font-size:.78rem; font-weight:600; color:var(--ink);
  background:var(--card); border:1px solid var(--rule-2); border-radius:5px; padding:.15rem .25rem; min-height:1.9rem}
.dt input:focus-visible{outline:2.5px solid var(--accent); outline-offset:1px}
.due{font-size:.8rem; font-weight:600; color:var(--accent-ink); background:var(--accent-soft);
  border-radius:7px; padding:.42rem .55rem; margin-top:.45rem; line-height:1.4}
.due:empty{display:none}
.cap{font-family:var(--f-data); font-size:.7rem; color:var(--ink-2); margin-top:.4rem; letter-spacing:.01em}
.cap.over{color:var(--crit); font-weight:700}
.ses-when{font-size:.8rem; color:var(--ink-2); line-height:1.45; padding-bottom:.4rem}
.ses{padding:.55rem 0; border-top:1px solid var(--rule)}
.ses:first-of-type{border-top:0}
.ses-h{display:flex; align-items:baseline; gap:.5rem; margin-bottom:.4rem}
.ses-h b{font-size:.88rem; font-weight:600}
.steps{display:flex; flex-wrap:wrap; gap:.4rem}
.step{display:flex; align-items:center; gap:.42rem; padding:.4rem .6rem .4rem .45rem; border-radius:9px;
  border:1.8px solid var(--rule-2); background:var(--card-2); cursor:pointer; font:inherit;
  min-height:2.6rem; color:var(--ink-2); transition:background .14s, border-color .14s, color .14s}
.step:hover{border-color:var(--accent)}
.stepbox{flex:0 0 auto; width:1.15rem; height:1.15rem; border-radius:5px; border:1.8px solid var(--rule-2);
  background:var(--card); display:grid; place-items:center}
.stepbox svg{width:.72rem; height:.72rem; color:var(--on-accent); opacity:0; transform:scale(.6); transition:opacity .14s, transform .14s}
.steptxt{font-size:.78rem; font-weight:600; line-height:1.25; text-align:left}
.steptxt i{display:block; font-style:normal; font-weight:500; font-size:.66rem; color:var(--ink-3); margin-top:.05rem}
.step[aria-checked="true"]{background:var(--accent-soft); border-color:var(--accent); color:var(--accent-ink)}
.step[aria-checked="true"] .stepbox{background:var(--accent); border-color:var(--accent)}
.step[aria-checked="true"] .stepbox svg{opacity:1; transform:scale(1)}
.step[aria-checked="true"] .steptxt i{color:var(--accent-ink)}

/* ============ REFERENCE BLOCKS ============ */
.block{background:var(--card); border:1px solid var(--rule); border-radius:14px; box-shadow:var(--shadow); padding:1rem; margin-bottom:.7rem}
.block > h2{font-size:1.02rem; margin-bottom:.15rem}
.block > .lede{font-size:.85rem; color:var(--ink-2); margin-bottom:.6rem; line-height:1.5}
.block.crit{border-color:var(--crit-rule); background:var(--crit-soft)}
.block.crit > h2{color:var(--crit)}
.eyebrow{font-family:var(--f-data); font-size:.65rem; letter-spacing:.11em; text-transform:uppercase; color:var(--ink-3); font-weight:600; margin-bottom:.4rem; display:block}
ul.plain{list-style:none; margin:0; padding:0; display:flex; flex-direction:column}
ul.plain li{border-top:1px solid var(--rule); padding:.55rem 0; font-size:.9rem; line-height:1.45; display:flex; gap:.6rem; align-items:flex-start}
ul.plain li:first-child{border-top:0}
.block.crit ul.plain li{border-color:var(--crit-rule)}
.bul{flex:0 0 auto; width:1.05rem; height:1.05rem; margin-top:.16rem; color:var(--crit)}
.bul.ok{color:var(--accent)}
.med{border-top:1px solid var(--rule); padding:.7rem 0}
.med:first-of-type{border-top:0}
.med h3{font-size:.95rem; display:flex; align-items:baseline; gap:.45rem; flex-wrap:wrap}
.dose{font-family:var(--f-data); font-size:.78rem; color:var(--accent-ink); background:var(--accent-soft); padding:.1rem .4rem; border-radius:5px; font-weight:600}
.med p{font-size:.83rem; color:var(--ink-2); margin-top:.28rem; line-height:1.5}
a.call{display:flex; align-items:center; gap:.75rem; padding:.72rem .2rem; border-top:1px solid var(--rule); text-decoration:none; color:inherit; min-height:3rem}
a.call:first-of-type{border-top:0}
.call .who{flex:1; min-width:0}
.call .who b{display:block; font-size:.9rem; font-weight:600}
.call .who span{display:block; font-size:.755rem; color:var(--ink-3); line-height:1.4}
.call .num{font-family:var(--f-data); font-size:.85rem; color:var(--accent-ink); font-weight:600; white-space:nowrap; font-variant-numeric:tabular-nums}
.call svg{width:1rem; height:1rem; color:var(--accent); flex:0 0 auto}
.ask{border:1px solid var(--warn-rule); background:var(--card); border-radius:12px; margin-bottom:.6rem; overflow:hidden}
.ask .q{padding:.75rem .85rem; font-size:.9rem; font-weight:600; line-height:1.4; display:flex; gap:.6rem; align-items:flex-start; background:var(--warn-soft); color:var(--ink)}
.ask .q em{font-family:var(--f-data); font-style:normal; font-size:.7rem; color:var(--warn); font-weight:700; flex:0 0 auto; margin-top:.15rem; letter-spacing:.04em}
.ask .body{padding:.7rem .85rem .8rem; display:flex; flex-direction:column; gap:.5rem}
.prov{font-size:.775rem; color:var(--ink-2); line-height:1.55}
.prov dl{margin:.5rem 0 0; display:grid; grid-template-columns:auto 1fr; gap:.3rem .6rem; align-items:baseline}
.prov dt{font-family:var(--f-data); font-size:.66rem; color:var(--ink); background:var(--card-2); border:1px solid var(--rule); padding:.06rem .32rem; border-radius:4px; letter-spacing:.04em; font-weight:600; white-space:nowrap}
.prov dd{margin:0; font-size:.775rem; color:var(--ink-2); line-height:1.45}

<script>
"use strict";

/* ══════════════════════════════════════════════════════════════════════════
   ONE PARAMETER. Every date on this page is computed from it at render time.
   ══════════════════════════════════════════════════════════════════════════ */
const SURGERY = new Date(2026, 7, 31);   // Monday, August 31, 2026 — right TKR
const SIDE    = "right";
const STORE   = "tkr-2026-08-31.v1";

const SRC = {
  SEQ:  "Sequoia Hospital Total Joint Replacement Pre-Operative Education slides",
  PAMF: "Palo Alto Medical Foundation Preoperative Hip & Knee Replacement Seminar slides",
  CHK:  "Sequoia Patient Checklist, Pre-Op Patient Timeline & Knee Replacement FAQs",
  HW:   "Your own handwritten notes on the printed materials"
};

const DAY = 864e5;
const at  = n => new Date(SURGERY.getTime() + n * DAY);
const fmt = d => d.toLocaleDateString("en-US",{weekday:"short",month:"short",day:"numeric"});
const fmtL= d => d.toLocaleDateString("en-US",{weekday:"long",month:"long",day:"numeric",year:"numeric"});
const midnight = d => new Date(d.getFullYear(), d.getMonth(), d.getDate());
/* A test seam: ?today=N pretends it is N days from surgery, so the app can be
   exercised on any day of the recovery without waiting for the calendar.
   Absent in normal use, and it only ever changes what is displayed. */
const DAY_OVERRIDE = (function(){
  try { const q = new URLSearchParams(location.search).get("today");
        return q === null || q === "" || isNaN(+q) ? null : Math.round(+q); }
  catch(e){ return null; }
})();
const offsetToday = () => DAY_OVERRIDE !== null ? DAY_OVERRIDE
                        : Math.round((midnight(new Date()) - SURGERY) / DAY);

/* ── where the documents disagree ───────────────────────────────────────────
   pref  = index of the reading to follow, under the PAMF-first rule you set.
           null means PAMF does not address it, so the rule cannot settle it.
   pick  = one-line statement of what following that reading actually means.  */
const CONFLICTS = {
  npo: {
    q: "Clear liquids: until 4 hours before surgery time, or until 2 hours before arrival?",
    why: "These two only line up if arrival is exactly 2½ hours before surgery — and the arrival time is itself disputed. Drinking too close to the case risks aspiration under anesthesia, and the case gets cancelled if the team is unsure.",
    pref: null,
    pick: "PAMF does not cover the fasting window, so this stays open. Ask Sequoia when they call on the Friday with your time.",
    opts: [
      {s:"CHK", v:"“Clear liquids (water, clear broth, apple juice, black coffee, Gatorade) may be consumed until 4 hours before your scheduled surgery time.” … “Stop all food and drink, including water, 4 hours before your scheduled surgery time.”", n:"You circled both phrases."},
      {s:"SEQ", v:"“Nothing to eat after midnight! Your surgeon may encourage you to drink clear fluids (no jello) up to 2 hours prior to arrival to the hospital.”", n:"You circled “2 hours prior to arrival.”"}
    ]
  },
  arrive: {
    q: "Arrive 2 hours or 2½ hours before the surgery time?",
    why: "It changes when you leave the house, and it changes the clear-liquid cutoff above if that one is anchored to arrival.",
    pref: 1,
    pick: "Arrive 2 hours before your surgery time.",
    opts: [
      {s:"CHK", v:"“Arrive at the hospital 2 hours before your scheduled surgery time.”", n:"You circled it."},
      {s:"HW",  v:"“2 hrs before” — written on the PAMF Surgery Times slide, beside the date 8/28.", n:"PAMF's printed slide gives no arrival interval; this note of yours sits on it, and the Sequoia checklist agrees with it."},
      {s:"SEQ", v:"“Arrival 2 1/2 hours prior to surgery.”"}
    ]
  },
  shave: {
    q: "Stop shaving your legs 7, 5, or 3 days before?",
    why: "Micro-nicks in the skin are a route for the bacteria that cause a prosthetic joint infection, which is what this whole protocol is built around. Three documents give three different intervals.",
    pref: 3,
    pick: "PAMF says do not shave, but gives no interval — so it tells you what, not when. The 7 / 5 / 3 day question still needs one answer.",
    opts: [
      {s:"CHK", v:"Patient Checklist, in the “7 Days Before” block: “Stop shaving legs.”"},
      {s:"SEQ", v:"“No shaving of your operative leg 5 days prior to surgery.”"},
      {s:"CHK", v:"Pre-Op Timeline, “3 days before surgery”: “Stop shaving body hair. Okay to continue shaving facial hair.”", n:"You wrote 8/27 beside it — 4 days before, slightly earlier than the printed rule."},
      {s:"PAMF",v:"“DO NOT SHAVE LEGS BEFORE SURGERY!”", n:"No interval given."}
    ]
  },
  miralax: {
    q: "Start Miralax 7 days or 5 days before?",
    why: "Opioids plus immobility make constipation after surgery close to universal, so starting early matters — but starting too early causes the loose stools the timeline itself warns about.",
    pref: null,
    pick: "PAMF does not mention Miralax, so this stays open.",
    opts: [
      {s:"CHK", v:"Pre-Op Timeline, “1 week before surgery”: “Please start taking Miralax one week before surgery date. If you experience loose stools, stop taking.”", n:"You wrote 8/24 and starred it."},
      {s:"CHK", v:"Patient Checklist, “5 Days Before”: “Start taking a laxative, please consult with MD surgeon.”"},
      {s:"SEQ", v:"“Miralax (may begin 3-5 days before surgery; check with physician).”"}
    ]
  },
  vitd: {
    q: "Vitamin D — stop it with the other vitamins at 7 days, or keep taking it?",
    why: "One document tells you to start Vitamin D two weeks out; another tells you to stop all vitamins seven days out. Your own note on this carries a question mark.",
    pref: 0,
    pick: "PAMF puts Vitamin D outside the group Sequoia stops at seven days. Your note on that same PAMF slide sets the stop at Saturday 29 August.",
    opts: [
      {s:"PAMF",v:"“Vitamin D: 1000 units/day two weeks before surgery.”", n:"PAMF sets the start but never states a stop."},
      {s:"CHK", v:"Patient Checklist, “7 Days Before”: “Stop taking blood thinners: non-steroidal anti-inflammatories, vitamins, herbal medications, supplements containing Vitamin E or Fish Oil.”"},
      {s:"HW",  v:"“Stop Saturday 8/29” beside the Supplements slide — and elsewhere, “Vit D up to PR day (?)”", n:"The question mark is yours."}
    ]
  },
  walk: {
    q: "Is “one block a day in week one” a floor to reach, or a ceiling not to exceed?",
    why: "The sharpest disagreement in the folder: the same number, labelled minimum by one document and maximum by the other. Under-walking stiffens the knee and slows range of motion; over-walking drives swelling and pain.",
    pref: 1,
    pick: "A ceiling. One block in week one, two in week two — not more.",
    opts: [
      {s:"CHK", v:"“General rule of thumb is at a minimum 1 block per day the first week, 2 blocks the second week, 3 blocks the third week. Each block ~250 feet. Can increase walking distance by 25-50% each week, not to exceed more than 2000 feet (or steps) the first two weeks.”"},
      {s:"PAMF",v:"“One block per day per week · 1000 steps per day per week · Week One = One Block · Week Two = Two Blocks”", n:"You wrote “Maximum” underneath. Because this reverses Sequoia's reading, it is the one most worth confirming out loud."}
    ]
  },
  shower: {
    q: "First shower at 48 hours, or on day 4?",
    why: "This one is answerable at discharge — you just need to look at, or ask about, the dressing before you leave the hospital.",
    pref: 1,

function taskPhase(t){
  const o = taskOffset(t);
  if(o < PHASES[0].from) return PHASES[0].id;
  const p = PHASES.find(p => o >= p.from && o <= p.to);
  return p ? p.id : PHASES[PHASES.length-1].id;
}

const saveNotes = () => { try { localStorage.setItem(NOTESTORE, JSON.stringify(notes)); } catch(e){} };
/* Item keys are the item's own stable id, NEVER its position. Reordering or
   inserting a task must not move somebody's check mark onto a different task. */
PHASES.forEach(p => p.items.forEach(it => { it.key = it.k; }));

/* One-time migration from the old position-based keys (phase:index). Runs once,
   then records that it has run so it can never double-apply. */
const MIGRATED = STORE + ".migrated.v2";
const OLD_TO_NEW = {};
PHASES.forEach(p => p.items.forEach((it,ix) => { OLD_TO_NEW[p.id + ":" + ix] = it.k; }));
(function migrate(){
  try {
    if(localStorage.getItem(MIGRATED)) return;
    let moved = 0;
    Object.keys(OLD_TO_NEW).forEach(oldK => {
      const newK = OLD_TO_NEW[oldK];
      if(done[oldK] && !done[newK]){ done[newK] = true; moved++; }
      delete done[oldK];
      const oldN = "n:item:" + oldK, newN = "n:item:" + newK;
      if(notes[oldN] && !notes[newN]){ notes[newN] = notes[oldN]; moved++; }
      delete notes[oldN];
    });
    if(moved){ save(); saveNotes(); }
    localStorage.setItem(MIGRATED, "1");
  } catch(e){}
})();

/* Editing a recorded time: the date part stays on that tracker day, only the
   clock time moves, so a correction can never fling a dose to another day. */
document.addEventListener("change", e => {
  const inp = e.target.closest("[data-time]"); if(!inp) return;
  const k = inp.dataset.time, d = +inp.dataset.day;
  const parts = String(inp.value||"").split(":");
  if(parts.length !== 2) return;
  const base = new Date(times[k] || Date.now());
  base.setHours(+parts[0], +parts[1], 0, 0);
  /* A dose cannot have been taken in the future. Two different futures:
     - 11:00pm typed at half past midnight means LAST night -> roll back a day,
       which lands it in the last 12 hours and is clearly what was meant.
     - 4:51am typed at 2:51am is a slip; rolling back would call it 22 hours
       ago and, for the opioid, wrongly say another may be taken. Clamp to now
       instead, which only ever delays the next dose. */
  const now = Date.now();
  if(base.getTime() > now + 60000){
    const rolled = base.getTime() - 864e5;
    base.setTime(now - rolled <= 12*3600000 && rolled <= now ? rolled : now);
  }
  times[k] = base.getTime();
  saveTimes();
  const trow = inp.closest(".trow");
  const cap = trow && trow.querySelector(".cap");
  if(cap){
    const rid = k.split(":")[2], row = TRACK.flatMap(g=>g.rows).find(x=>x.id===rid);
    if(row) cap.outerHTML = (function(){ const t=document.createElement("div");
      t.innerHTML = doseTimesHTML(d,row); const c=t.querySelector(".cap"); return c ? c.outerHTML : ""; })();
  }
  refreshDue();
});

   Check marks live in this browser's localStorage and nowhere else. iOS can
   discard that after about a week of not opening the page, so the page offers
   a file (via the downloads capability) and a copy/paste fallback that works
   everywhere.                                                                */
const BACKUP_TAG = "knee-passport";
/* Memoize the PROMISE, not the resolved value. Memoizing the value lets a
   second caller read it before the first await settles, get undefined, and
   wrongly conclude the capability is missing. */
let _dlPromise = null;
function getDownloads(){
  if(_dlPromise) return _dlPromise;
  _dlPromise = (async () => {
    try {
      return (typeof window !== "undefined" && window.claude && typeof window.claude.use === "function")
        ? await window.claude.use("downloads") : null;
    } catch(e){ return null; }
  })();
  return _dlPromise;
}
const backupPayload = () => JSON.stringify({
  app: BACKUP_TAG, version: 3,
  surgery: [SURGERY.getFullYear(), String(SURGERY.getMonth()+1).padStart(2,"0"), String(SURGERY.getDate()).padStart(2,"0")].join("-"),
  savedAt: new Date().toISOString(),
  marks: done,
  notes: notes,
  times: times,
  tasks: tasks
}, null, 2);
const backupName = () => { const n = new Date();
  return BACKUP_TAG + "-backup-" + [n.getFullYear(), String(n.getMonth()+1).padStart(2,"0"), String(n.getDate()).padStart(2,"0")].join("-") + ".json"; };

/* Hide the file-save button wherever the capability isn't granted (local file,
   older viewer, capability revoked). The copy/paste path always works. */
async function syncBackupUI(){
  const d = await getDownloads();
  if(!d) document.querySelectorAll(".bk-save").forEach(b => b.hidden = true);
}

function bkSay(root, text, tone, which){
  const el = root.querySelector(which === 2 ? ".bk-msg2" : ".bk-msg");
  if(!el) return;
  el.textContent = text;
  if(tone) el.setAttribute("data-tone", tone); else el.removeAttribute("data-tone");
}

async function bkSave(root){
  const d = await getDownloads();
  if(!d){
    bkSay(root, "Saving a file isn’t available here. Use “Copy backup text” instead, and paste it somewhere safe — an email to yourself works.", "warn");
    document.querySelectorAll(".bk-save").forEach(b => b.hidden = true);
    return;
  }
  const name = backupName();
  try {
    await d.save({filename:name, data:backupPayload()});
    bkSay(root, "Backup saved as " + name + "."); markBackedUp();
  } catch(err){
    const code = err && err.code;
    if(code === "declined")            bkSay(root, "Backup cancelled — nothing was saved.", "warn");
    else if(code === "rate_limited")   bkSay(root, "A save prompt is already open. Wait a moment and try again.", "warn");
    else if(code === "too_large")      bkSay(root, "That backup is too big to save as a file. Use “Copy backup text” instead.", "warn");
    else if(code === "bad_request" || code === "transform_error")
                                       bkSay(root, "The backup file could not be built. Use “Copy backup text” instead.", "warn");
    else {
      bkSay(root, "Saving a file isn’t available here. Use “Copy backup text” instead.", "warn");
      document.querySelectorAll(".bk-save").forEach(b => b.hidden = true);
    }
  }
}

async function bkCopy(root){
  const text = backupPayload();
  /* Put the text on screen and selected FIRST, so every path below leaves the
     user able to copy by hand. This is the OUTPUT box — kept separate from the
     restore box, so a copy can never be mistaken for something to restore. */
  const wrap = root.querySelector(".bk-outwrap"), ta = root.querySelector(".bk-out");
  wrap.hidden = false; ta.value = text; ta.focus(); ta.select();
  ta.setSelectionRange(0, text.length);

  /* execCommand first: it is synchronous and runs inside the click gesture, so
     it survives the sandboxed iframe that blocks the async clipboard API. */
  try { if(document.execCommand && document.execCommand("copy")){
    bkSay(root, "Backup text copied. Paste it into an email or a note to yourself — that is your restore point.");
    markBackedUp(); return;
  }} catch(e){ /* fall through */ }

  try {
    if(navigator.clipboard && navigator.clipboard.writeText){
      await navigator.clipboard.writeText(text);
      bkSay(root, "Backup text copied. Paste it into an email or a note to yourself — that is your restore point.");
      markBackedUp(); return;
    }
  } catch(e){ /* fall through */ }

  bkSay(root, "This browser will not let the page copy for you. Your backup is in the box just below, already selected — press " +
    (/Mac|iPhone|iPad/.test(navigator.platform || navigator.userAgent) ? "⌘C" : "Ctrl+C") + " to copy it.", "warn");
  markBackedUp();
}

function bkApply(root, mode){
  const raw = root.querySelector(".bk-text").value.trim();
  if(!raw){ bkSay(root, "Paste your backup text into the box first.", "warn", 2); return; }
  let data;
  try { data = JSON.parse(raw); }
  catch(e){ bkSay(root, "That doesn’t look like a backup — the text is incomplete or something was cut off in copying.", "warn", 2); return; }
  if(!data || data.app !== BACKUP_TAG || typeof data.marks !== "object" || data.marks === null){
    bkSay(root, "That is valid text but not a Knee Passport backup.", "warn", 2); return;
  }
  const mine = [SURGERY.getFullYear(), String(SURGERY.getMonth()+1).padStart(2,"0"), String(SURGERY.getDate()).padStart(2,"0")].join("-");
  if(data.surgery && data.surgery !== mine){
    bkSay(root, "That backup is for a surgery date of " + data.surgery + ", but this page is set to " + mine + ". Nothing was changed.", "warn", 2); return;
  }
  /* Every check happens BEFORE anything is cleared. An earlier version wiped
     first and validated the surgery date after, so a mismatched backup
     destroyed the device's data and then refused to restore. */
  if(mode === "replace"){
    const n = Object.keys(done).length, tn = tasks.length;
    askConfirm("Replace everything?",
      "This device holds " + n + " check mark" + (n===1?"":"s") +
      (tn ? ", " + tn + " task" + (tn===1?"":"s") + " you added" : "") +
      ", plus any notes and dose times. All of it will be discarded and replaced with what this backup contains. There is no undo.",
      "Replace everything",
      () => { done = {}; notes = {}; times = {}; tasks = []; bkCommit(root, data, mode); });
    return;
  }
  bkCommit(root, data, mode);
}

function bkCommit(root, data, mode){
  /* A backup taken before stable ids still uses phase:index keys. Map those
     forward so an older backup restores onto the right tasks. */
  const fwd = k => OLD_TO_NEW[k] || k;
  const fwdNote = k => k.indexOf("n:item:")===0 ? "n:item:" + fwd(k.slice(7)) : k;
  let added = 0, notesAdded = 0, notesKept = 0;
  Object.keys(data.marks).forEach(k0 => { const k = fwd(k0);
    if(data.marks[k0] && !done[k]){ done[k] = true; added++; } });
  /* Notes are never overwritten: if this device already has a note under the
     same key, the local one wins and the backup's copy is reported as kept
     back rather than silently discarding either. */
  if(data.notes && typeof data.notes === "object"){
    Object.keys(data.notes).forEach(k0 => {
      const k = fwdNote(k0);
      const incoming = String(data.notes[k0] || "").trim();
      if(!incoming) return;
      if(!notes[k] || !notes[k].trim()){ notes[k] = data.notes[k0]; notesAdded++; }
      else if(notes[k].trim() !== incoming) notesKept++;
    });
  }
  if(data.times && typeof data.times === "object"){
    Object.keys(data.times).forEach(k0 => { const k = fwd(k0);
      if(done[k] && !times[k]) times[k] = data.times[k0]; });
  }
  let tasksAdded = 0;
  if(Array.isArray(data.tasks)){
    data.tasks.forEach(t => { if(t && t.id && t.text && t.date && !tasks.some(x=>x.id===t.id)){ tasks.push(t); tasksAdded++; } });
  }
  save(); saveNotes(); saveTimes(); if(tasksAdded) saveTasks();
  renderTimeline(); renderDaily(); renderAsk(); renderHead(); refreshDue(); renderBanner();
  const root2 = document.querySelector("#p-timeline .bk") || root;
  const bits = [];
  if(added)      bits.push(added + " check mark" + (added===1?"":"s"));
  if(notesAdded) bits.push(notesAdded + " note" + (notesAdded===1?"":"s"));
  if(tasksAdded) bits.push(tasksAdded + " task" + (tasksAdded===1?"":"s") + " of your own");
  const joined = bits.length > 1 ? bits.slice(0,-1).join(", ") + " and " + bits[bits.length-1] : bits[0];
  let msg = mode === "replace"
      ? "Replaced — this device now holds exactly what the backup contained: " + (joined || "nothing") + "."
      : (bits.length ? "Restored — " + joined + " added. Nothing was removed."
                     : "Backup read successfully. Everything in it was already here.");
  if(notesKept) msg += " " + notesKept + " note" + (notesKept===1?" in the backup differs":"s in the backup differ") +
    " from what is on this device; the version already here was kept.";
  bkSay(root2, msg, null, 2);
}

document.addEventListener("click", e => {
  const btn = e.target.closest(".bk-save,.bk-copy,.bk-apply,.bk-replace,.bk-clearbox");
  if(!btn) return;
  const root = btn.closest(".bk");
  if(btn.classList.contains("bk-save"))     { bkSave(root); return; }
  if(btn.classList.contains("bk-copy"))     { bkCopy(root); return; }
  if(btn.classList.contains("bk-apply"))    { bkApply(root); return; }
  if(btn.classList.contains("bk-replace"))  { bkApply(root, "replace"); return; }
  if(btn.classList.contains("bk-clearbox")) { root.querySelector(".bk-text").value = ""; bkSay(root, ""); }
});

/* ── the Today card ─────────────────────────────────────────────────────────
   What is owed right now, at the very top, tickable in place. Everything dated
   today, plus anything earlier still unticked — nothing falls off the back,
   which matters most for the pre-op stops that can cancel an operation.       */
function outstanding(){
  const t = offsetToday(), due = [], late = [];
  PHASES.forEach(p => p.items.forEach(it => {
    if(it.x || done[it.key]) return;
    const d = Array.isArray(it.d) ? it.d[0] : it.d;
    if(d === t) due.push({key:it.key, text:it.i, src:it.s, d});
    else if(d < t) late.push({key:it.key, text:it.i, src:it.s, d});
  }));
  tasks.forEach(x => {
    const key = "u:" + x.id; if(done[key]) return;
    const d = taskOffset(x);
    if(d === t) due.push({key, text:x.text, src:"yours", d, mine:1});
    else if(d < t) late.push({key, text:x.text, src:"yours", d, mine:1});
  });
  /* Most recent first. Oldest-first buried anything current behind pre-op items
     from weeks ago that will never be ticked — the newest overdue item is the
     one she can still act on. */
  late.sort((a,b)=>b.d-a.d);
  return {due, late, t};
}
function todayRow(o){
  return '<li class="item trow-today' + (o.mine?' mine':'') + '" data-key="' + esc(o.key) + '">' +
    '<button class="row" role="checkbox" aria-checked="false"><span class="box">' + svgCheck + '</span>' +
    '<span class="txt">' + (o.d !== offsetToday()
        ? '<span class="when-tag' + (o.mine?' mine':'') + '">' + esc(fmt(at(o.d))) + '</span>' : '') +
      esc(o.text) + '<span class="src' + (o.mine?' mine':'') + '">' + esc(o.src) + '</span></span></button></li>';
}
function todayHTML(){
  const {due, late, t} = outstanding();
  let html = '<section class="block today" id="todaycard">' +
    '<div class="today-h"><h2>Today</h2><span class="today-d">' + esc(fmtL(at(t))) + '</span></div>';

  if(!due.length && !late.length){
    html += '<p class="today-clear">Nothing outstanding. Everything dated today or earlier is ticked off.</p>';
  }
  if(due.length){
    html += '<span class="eyebrow">Due today</span><ul class="items">' + due.map(todayRow).join("") + '</ul>';
  }
  if(late.length){
    /* Capped. After surgery every unticked pre-op task is still technically
       "open", and a list of sixty things she can no longer act on is noise —
       it buries the two or three that matter. The full set stays on the
       timeline; this shows the oldest few and says how many remain. */
    const CAP = 8, shown = late.slice(0, CAP), rest = late.length - shown.length;
    html += '<span class="eyebrow' + (due.length?' spaced':'') + '">Still open from earlier</span>' +
      '<ul class="items">' + shown.map(todayRow).join("") + '</ul>' +
      (rest > 0 ? '<p class="today-more">and ' + rest + ' older item' + (rest===1?'':'s') + ' still unticked — the full list is on the timeline below.</p>' : '');
  }

  /* during the tracked fortnight, the two things she is most likely to open the app for */
  if(t >= TRACK_DAYS[0] && t <= TRACK_DAYS[TRACK_DAYS.length-1]){
    const meds = TRACK.flatMap(g=>g.rows).filter(r=>r.every && r.id!=="mel" && r.id!=="thin");
    html += '<span class="eyebrow spaced">Medication</span><div class="today-meds">' +
      meds.map(r=>'<p class="due" data-row="' + t + ':' + r.id + '">' + esc(dueText(t,r)) + '</p>').join("") +
      '</div>';
  }
  const nextSes = (()=>{
    for(const g of SESSIONS){ if(!g.dates) continue;
      for(const d of g.dates){ const off = Math.round((new Date(d+"T00:00:00") - SURGERY)/DAY);
        if(off >= t && !done[sesKey(g.id,d,"did")]) return {g, d, off}; } }
    return null;
  })();
  if(nextSes){
    html += '<span class="eyebrow spaced">Next therapy session</span>' +
      '<p class="today-ses"><b>' + esc(fmt(new Date(nextSes.d+"T00:00:00"))) + '</b> · ' + esc(nextSes.g.g) +
      (nextSes.off === t ? ' — <b>today</b>' : ' — in ' + (nextSes.off - t) + ' day' + (nextSes.off-t===1?'':'s')) +
      '<br><span>Take your pain medication 30–60 minutes beforehand.</span></p>';
  }
  return html + '</section>';
}

/* ── search ─────────────────────────────────────────────────────────────────
   Every line transcribed from the three documents, plus her own notes and
   tasks, in one flat index. Not a chatbot — a published page cannot call a
   language model — but it answers the same "what did they say about X" question. */
/* ── the two safety nets ────────────────────────────────────────────────────
   Changing the pinned version hands this page a brand-new, empty storage box —
   the previous version's data is still on the device but unreachable. Nothing
   in code can prevent that. These two just make it survivable: nag her to keep
   an off-device copy, and, if she ever opens a blank app, say what happened
   instead of letting it look like everything is lost. */
const LASTBK = STORE + ".lastbackup";
function markBackedUp(){
  try { localStorage.setItem(LASTBK, JSON.stringify({at: Date.now(), n: countEntries()})); } catch(e){}
  renderBanner();
}
function countEntries(){
  return Object.keys(done).length + Object.keys(notes).length +
         Object.keys(times).length + tasks.length;
}
function renderBanner(){
  const el = document.getElementById("banner");
  if(!el) return;
  const n = countEntries();

  if(n === 0){
    el.className = "banner empty";
    el.innerHTML = '<b>Nothing here yet</b>' +
      '<p>If you have used this before and expected to see your work, it is not lost — a new version of the app gets a fresh, empty page. ' +
      'Open <b>Save · Restore</b> below, paste your last emailed backup into the box, and press <b>Add to what is here</b>.</p>' +
      '<div class="acts"><button class="act prim" data-goback="1">Open Save · Restore</button></div>';
    el.hidden = false;
    return;
  }

  let last = null;
  try { last = JSON.parse(localStorage.getItem(LASTBK) || "null"); } catch(e){}
  const since = last ? n - last.n : n;
  const days  = last ? Math.floor((Date.now() - last.at) / 864e5) : null;

  if(!last){
    el.className = "banner";
    el.innerHTML = '<b>You have not saved a copy yet</b>' +
      '<p>Your ' + n + ' entr' + (n===1?"y is":"ies are") + ' stored only on this iPad, and an app update wipes them. ' +
      'Take one minute now: <b>Save · Restore</b> → <b>Copy backup text</b> → email it to yourself.</p>' +
      '<div class="acts"><button class="act prim" data-goback="1">Back it up now</button></div>';
    el.hidden = false; return;
  }
  if(since >= 5 || (days !== null && days >= 3)){
    el.className = "banner";
    el.innerHTML = '<b>Time to save a fresh copy</b>' +
      '<p>' + (since > 0 ? since + " new entr" + (since===1?"y":"ies") + " since" : "It has been") +
      (days !== null ? (since > 0 ? " your last backup " + (days===0 ? "today" : days + " day" + (days===1?"":"s") + " ago") : days + " day" + (days===1?"":"s") + " since your last backup") : "") +
      '. Emailing yourself a copy takes a minute and is the only thing that survives an app update.</p>' +
      '<div class="acts"><button class="act prim" data-goback="1">Back it up now</button></div>';
    el.hidden = false; return;
  }
  el.hidden = true;
}

function buildIndex(){
  const ix = [];
  const add = (t, extra, src, where, go) => ix.push({t, x:(extra||""), src, where, go});
  PHASES.forEach(p => p.items.forEach(it =>
    add(it.i, (it.n||"") + " " + (it.hw||""), it.s, p.title, {tab:"timeline", phase:p.id})));
  tasks.forEach(t => add(t.text, notes["n:item:u:"+t.id]||"", "yours", "Your own tasks", {tab:"timeline", phase:taskPhase(t)}));
  Object.keys(CONFLICTS).forEach(k => { const c = CONFLICTS[k];
    add(c.q, c.why + " " + c.pick + " " + c.opts.map(o=>o.v+" "+(o.n||"")).join(" "),
        "sources differ", "Ask team", {tab:"ask"}); });
  MEDS.forEach(m => add(m.n + " — " + m.d, m.p, m.s, "Medications", {tab:"daily"}));
  TRACK.forEach(g => g.rows.forEach(r =>
    add(r.n, typeof r.p === "function" ? r.p(1) : r.p, "tracker", "Each day", {tab:"daily"})));
  SESSIONS.forEach(g => add(g.g, g.when + " " + g.note, g.s, "Each day", {tab:"daily"}));
  RED.crit.forEach(x => add(x, "emergency", "call 911", "Watch for", {tab:"alerts"}));
  RED.call.forEach(x => add(x, "", "call the office", "Watch for", {tab:"alerts"}));
  RED.normal.forEach(x => add(x, "", "expected, not a problem", "Watch for", {tab:"alerts"}));
  CONTACTS.forEach(g => g.list.forEach(c => add(c.n + " — " + c.t, c.d, g.g, "Call", {tab:"contacts"})));
  PACK.yes.forEach(x => add(x, "", "bring to hospital", "Hospital bag", {tab:"timeline", phase:"pack"}));
  PACK.no.forEach(x => add(x, "", "leave at home", "Hospital bag", {tab:"timeline", phase:"pack"}));
  Object.keys(notes).forEach(k => { const v = notes[k]; if(v && v.trim())
    add(v, "", "your note", "Your notes", {tab: k.indexOf("n:ask:")===0 ? "ask" : (k.indexOf("n:day:")===0||k.indexOf("n:ses:")===0 ? "daily" : "timeline")}); });
  return ix;
}
const hl = (text, q) => {
  const i = text.toLowerCase().indexOf(q);
  if(i < 0) return esc(text);
  return esc(text.slice(0,i)) + "<mark>" + esc(text.slice(i,i+q.length)) + "</mark>" + esc(text.slice(i+q.length));
};
function runSearch(){
  const raw = document.getElementById("q").value.trim();
  const box = document.getElementById("results");
  document.getElementById("qx").hidden = !raw;
  if(raw.length < 2){ box.hidden = true; box.innerHTML = ""; return; }
  const q = raw.toLowerCase();
  const hits = buildIndex()
    .map(e => { const inT = e.t.toLowerCase().indexOf(q), inX = (e.x+" "+e.src).toLowerCase().indexOf(q);
                return (inT>=0 || inX>=0) ? {e, rank: inT>=0 ? 0 : 1} : null; })
    .filter(Boolean).sort((a,b)=>a.rank-b.rank).slice(0,60);

/* ── daily tracker ──────────────────────────────────────────────────────── */
const trkKey = (d,id,s) => "trk:" + d + ":" + id + ":" + s;
function dayTally(d){
  let c=0,n=0;
  TRACK.forEach(g=>g.rows.forEach(r=>{ if(r.prn) return; n+=r.slots;
    for(let s=0;s<r.slots;s++) if(done[trkKey(d,r.id,s)]) c++; }));
  return [c,n];
}
/* ── recorded dose times + when the next one is due ─────────────────────── */
/* Every ticked dose, whether or not a time was recorded. A dose ticked with no
   time still counts toward the daily total — it was taken — but it cannot
   drive the next-due clock, so it is listed with an empty time to fill in. */
function takenList(d,r){
  const out=[];
  for(let s=0;s<r.slots;s++){
    const k=trkKey(d,r.id,s);
    if(done[k]) out.push({k, s, t:times[k] || null});
  }
  return out.sort((a,b) => (a.t?0:1)-(b.t?0:1) || (a.t||0)-(b.t||0));
}
const timedOnly = list => list.filter(x => x.t);
function doseTimesHTML(d,r){
  if(!r.every) return "";
  const taken = takenList(d,r);
  if(!taken.length) return '<p class="due" data-row="' + d + ':' + r.id + '">No doses recorded yet today.</p>';

  let html = '<div class="dts">' + taken.map(x =>
    '<label class="dt' + (x.t ? '' : ' unset') + '"><span>' + esc(r.lab(x.s)) + '</span>' +
    '<input type="time" value="' + (x.t ? hhmm(x.t) : '') + '" data-time="' + x.k + '" data-day="' + d + '" aria-label="Time ' +
    esc(r.n + " " + r.lab(x.s)) + ' was taken"></label>').join("") + '</div>';

  if(r.capMg && r.mg){
    const total = taken.length * r.mg;
    const over = total > r.capMg;
    html += '<p class="cap' + (over ? ' over' : '') + '">' + total.toLocaleString() + ' mg of the ' +
      r.capMg.toLocaleString() + ' mg daily ceiling' + (over ? ' — over the limit in your notes' : '') + '.</p>';
  }
  html += '<p class="due" data-row="' + d + ':' + r.id + '"></p>';
  return html;
}
/* Rendered separately and refreshed on a timer, so the countdown stays live. */
function dueText(d,r){
  const all = takenList(d,r), timed = timedOnly(all);
  const missing = all.length - timed.length;
  const nudge = missing ? "  ·  " + missing + " dose" + (missing===1?" has":"s have") + " no time set — tap to add" : "";
  if(!all.length)  return "No doses recorded yet today.";
  if(!timed.length) return all.length + " dose" + (all.length===1?"":"s") +
    " ticked but no times recorded, so the next one cannot be worked out. Tap a time box to set one.";
  const last = timed[timed.length-1].t;
  const next = last + r.every*3600000;
  const now  = Date.now();
  const lead = "Last at " + clock(last) + " · ";
  if(r.prn){
    return (now >= next ? lead + "another may be taken now if needed (earliest was " + clock(next) + ")"
                        : lead + "not before " + clock(next) + " — " + gap(next-now) + " away") + nudge;
  }
  return (now >= next ? lead + "next dose due now (" + clock(next) + ", " + gap(now-next) + " ago)"
                      : lead + "next due " + clock(next) + " — in " + gap(next-now)) + nudge;
}
function refreshDue(){
  document.querySelectorAll("#p-daily .due[data-row]").forEach(el => {
    const [ds,rid] = el.dataset.row.split(":");
    const row = TRACK.flatMap(g=>g.rows).find(x=>x.id===rid);
    if(row) el.textContent = dueText(+ds, row);
  });
}
