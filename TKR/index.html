      {n:"Orthopaedic Surgery Floor", t:"Center for Joint Replacement, 3rd Floor."},
      {n:"Medicare / Insurance Companies", t:"2022 Removed from inpatient only list. Admitted as an outpatient. Medical Decision not age or Home status dictates Admission. Gloria Kwok can Assist."},
      {n:"Prepare For Going Home", t:"Designated Driver to and from Hospital. Food Preparation for Return Home. Designated Contact Person. Designated Care Giver for 3 days. Designated Pharmacy. List of Medications.", hw:"Paul · me · Paul · Paul · CVS Address + phone # · don't bring meds · Vit D up to PR day (?)"},
      {n:"Hospital Stay — length", t:"Same Day / 23 Hour / 2 Midnights. Depends on Age, Health, Size, Complexity of Surgery."},
      {n:"Hospital Stay — same day / 23 hours", t:"Surgery. PT in the afternoon. Regular Diet. Discharge Once Meet Requirement. Not meet requirements then discharge in morning."},
      {n:"Hospital Stay — 2 midnights", t:"Hold over due to Pain or Medical Issues. Oral pain medications. Physical Therapy. Occupational Therapy. Discharged home after therapy."},
      {n:"Hospital Stay — more than 2 midnights", t:"Older. Medical issues. Oral pain medications. Physical Therapy twice a day. Occupational Therapy once a day. Discharged to SNF."},
      {n:"Discharge Requirement", t:"PT & OT. Discharge Home if: Able to walk, Climb stairs, Pain Controlled.", hw:"Say 4-5. Don't say 2-3 or they will give you tylenol – don't want that"},
      {n:"Discharge Home", t:"Therapists Arrange Walker. Prescriptions provided preoperatively — changes may be made by Nurse Practitioner. Home Physical Therapy 2 weeks. Home Care Agencies.", hw:"2 wheels on front · Get new walker"},
      {n:"Discharge Medications", t:"Lovenox Injections: or return to Eliquis, Pradaxa. Pain Medications – Prescriptions. NSAIDs? Meloxicam. Return to Regular Medications. Check Pharmacy before Leaving the Hospital if any changes in medication."},
      {n:"Discharge to SNF", t:"Medical Issues. Lack of Family members is not a justification for SNF admission. Medication List Sent to SNF. Under SNF Physician Care. 7-10 Days. Return to clinic for suture removal."},
      {n:"Pain", t:"Spinal. Oral Pain Medications: Narcotic, NSAID. Knee replacements Aggressive Pain Management. Ice Machine.", hw:"always say pain is 4 or 5 · very painful procedure · where to get [ice machine]"},
      {n:"Narcotic Refills", t:"Oxycodone prescriptions: Please call us on Wednesday with enough time so we can get medications refilled. Give Hospital the name and address of Pharmacy on Admission. Check with Pharmacy before admission about Medication availability.", hw:"Tylenol 2 gms/day · check oxycodone amount · get refills if available · can cut oxy in half"},
      {n:"Nausea", t:"Anti-emetics. Ask early."},
      {n:"Fevers", t:"To help prevent fevers use the incentive spirometer at least 5-10 times every hour you are awake. Low grade temperature is normal. Call if temperature is over 101.5 °F. Cough and Deep Breathe after each use."},
      {n:"Sleeping Pills", t:"Ask nurse for the sleeping pills. Take 45 minutes to work."},
      {n:"Home Physical Therapy Post op", t:"Arranged by Case Manager. Two Weeks Home Physical Therapy. Call Angel for problems: 650-853-4848."},
      {n:"Physical Therapy — Knees", t:"Home PT 2 Weeks. Week 3 Begin Out-Patient PT. Arrange Out-Patient PT before Hospitalization. Duration 4-12 Weeks."},
      {n:"Physical Therapy — Hips", t:"Home PT 2 weeks. 2 Weeks No Formal PT, daily exercises taught by therapist. Week 5 Begin Out-Patient PT.", hw:"Upper body exercises while sitting on a bench"},
      {n:"Occupational Therapy", t:"Activities of Daily Living. Assistive Devices — buy at Clark Building Physical Therapy Front Desk. alimed.com, medmartusa.com, Amazon.", hw:"Hip Kit (circled) · Leg lifter"},
      {n:"Abduction Pillow", t:"Hip Replacements. Abduction Pillow discontinued when patient goes home. Regular pillow 2 weeks postoperative."},
      {n:"Activity", t:"1 week walker. 2 weeks cane.", hw:"minimum · no cheating"},
      {n:"Walking Distance", t:"One block per day per week. 1000 steps per day per week. Week One = One Block. Week Two = Two Blocks.", hw:"Maximum"},
      {n:"Blood Clots", t:"Blood Thinner (Arixtra) in the Hospital. Blood Thinner (Lovenox, Coumadin) for 10-20 Days after Surgery. Alternative Oral Eliquis 30 Days, two times a day. 20 Days of 81 mg ASA after Blood Thinner. Severe Injection Site Redness Call Office.", hw:"Don't do it · purple is normal · if you get a red area = reaction"},
      {n:"Constipation", t:"Fluids. Colace. Milk of Magnesia. MIRALAX. Dulcolax Suppositories. Ambulation.", hw:"need electrolytes"},
      {n:"Swelling and Bruising", t:"Expected. Lasts up to 6 months. Elevation. ICE. Compression."},
      {n:"Pre-op Soap Wash", t:"Wash with soap the night before and the morning of surgery. Clean Sheets. Clean Pajamas.", hw:"clean towel"},
      {n:"Supplements", t:"Vitamin D: 1000 units/day two weeks before surgery. Natural Yogurt: one cup/day two weeks before surgery.", hw:"Stop Saturday 8/29"},
      {n:"Clean Your Phone Daily", t:"Clean your phone daily.", hw:"a week before surgery · buy phone cleaner"},
      {n:"Elevated Toilet Seat", t:"Photograph of an elevated toilet seat with arm rails."},
      {n:"Wound Care", t:"Clean and Dry until 72 hours after. Showers 4 days after Surgery. No bath tubs for 4 weeks. Stitch abscess. Bleeding. Drainage.", hw:"Friday · Press + Seal"},
      {n:"Wound Check / Suture Removal", t:"10-14 Days. Clinic or at home by home health. SNF — Nurse at SNF will remove or can return to clinic for removal.", hw:"clean stitch with peroxide + call clinic"},
      {n:"What to Watch Out For", t:"Fevers over 101.5. Sudden bleeding from the wound. Drainage from the wound. Foul smells. Redness. Dislocation of the hip. Leg Swelling — Calf pain. Shortness of Breath or Chest Pain — Call 911.", hw:"after day 5 · ★ leg swelling / calf pain"},
      {n:"Expect the Unexpected", t:"Click of the knee replacement. Days of greater pain. Spotting of the wound. Stitch appearing from wound. Pustule in the wound. Knee will feel warm for 3-6 months. Leg Lengths — first few months operated hip often feels longer. Swelling in Operative Leg, keep leg elevated.", hw:"3-6 months · call · compressionstocking.com 18-20mm"},
      {n:"Follow up", t:"Call Angel 650-853-4848. Wound check at 10-14 days. X-rays 4-6 weeks. Clinical evaluation 8-12 weeks. 12 month follow up. At 5, 10, 15 Years. Don't wait until last minute to make appt.", hw:"Karen / Jennifer · Look on MHO"},
      {n:"Antibiotics — Dental Work", t:"Amoxicillin 2 gms one hour before procedure, OR Erythromycin 1 gm one hour before procedure.", hw:"circled"},
      {n:"Foot Care", t:"Foot infection can lead to an implant infection. Keep feet well moisturized. Prevent Cracking. Prevent Fungal infections. Regular use of Moisturizing Creams, Antifungal Creams."},
      {n:"Driving", t:"4-6 Weeks. Off Narcotics. Start in empty parking lot. Does not matter if left or right leg. Reaction time."},
      {n:"Hip Precautions", t:"Do not cross legs at the knees (externally rotate). Do not bring leg behind you (hyperextend the hip). Do not actively abduct the leg. Do not stand single stance on operative leg. 6 WEEKS.", note:"Hip only — does not apply to a knee replacement."},
      {n:"Things Not to do Two Weeks Preoperatively", t:"Gardening. Sports. Climbing Ladder. Climbing Roof. Cleaning floors. Kneeling on knees. Wearing short pants. Playing with Cats or Dogs. Clipping Toenails.", hw:"8/17 · don't scrape the skin · 1 week prior [toenails]"},
      {n:"Patient Tips — comfort", t:"Comfort items – Patient Packet: Ear plugs, Eye shades, Note pad.", hw:"+ pen"},
      {n:"Patient Tips — household", t:"Household items for return home: Long Handled Shoe Horn. Ice Bag or Ice Machine. DO NOT SHAVE LEGS BEFORE SURGERY!", hw:"from Hospital · Game ready ice machine $300"},
      {n:"Single Individuals", t:"Home must be prepared before surgery. Assign a coach. Arrange Preoperative and Postoperative Transportation. Not able to return home until safe. Return to Driving 3-4 weeks."},
      {n:"Hot Line", t:"650-321-4121 (doctors). 650-853-2951 (clinic), 8:30 AM – 5:30 PM. Angel's Secret # (650) 853-4848.", hw:"patients only · Knees painful, warm 3-6 mths — take your meds"}
    ]},

  { id:"seq", tag:"SEQ",
    name:"Total Joint Replacement Pre-Operative Education",
    who:"Sequoia Hospital, Dignity Health · 37 slides",
    pages:[
      {n:"Title", t:"Pre-Operative Education: Hip Replacement, Knee Replacement, Mako Robotic Surgery."},
      {n:"Who should read this", t:"Patients and Family are encouraged to read prior to total hip or knee replacement surgery. Know what to expect before, during, and after your procedure."},
      {n:"Purpose of education", t:"Prepare you for your hospitalization. Review daily routine & rehabilitation. Discharge planning."},
      {n:"Pre-Surgery — help at home", t:"Arrange for help at home prior to surgery. Who? Family, Friends, Neighbors. When? For 3-7 days after discharge. Ensure transportation is being arranged to and from surgery (not Uber/Lyft). Pre-cook meals, laundry, housekeeping/cleaning done. Stay hydrated 3 days before surgery to prevent low blood pressure/dizziness. Purchase over the counter meds & equipment recommended by surgeon. Review all educational materials from surgeon office and hospital. Ensure family member or caregiver reads educational materials as well."},
      {n:"Pre-Surgery — medications and washing", t:"Check with your medical doctor regarding medications prior to surgery. No anti-inflammatories 7 days prior to surgery. No yard work for 2 weeks. No alcohol 3 days prior to surgery. No shaving of your operative leg 5 days prior to surgery. Chlorhexidine shower — night before, clean PJs & sheets, and the morning of your surgery day.", hw:"+ Towel"},
      {n:"Pre-Surgery — the call and what to bring", t:"Hospital will call with surgery time the evening before (typically between 2-4pm). Nothing to eat after midnight! Your surgeon may encourage you to drink clear fluids (no jello) up to 2 hours prior to arrival to the hospital. Bring comfortable clothes, shoes, insurance card, access to credit card # if needed for prescriptions/equipment, and a long phone charger cord. Please do not bring valuables to the hospital.", hw:"Friday · circled “2-4pm” and “2 hours” · glasses case"},
      {n:"Hospital Stay — arrival", t:"Arrival 2 1/2 hours prior to surgery. There is a parking garage to the right of the entrance. Free valet service 0530 – 1400 Mon-Fri."},
      {n:"Day of surgery — where to go", t:"Enter through main hospital entrance. Please go to admitting/registration and continue straight down hallway on the right. Visitors are welcome to stay with you until you go into the operating room."},
      {n:"Pre-Surgery — Ambulatory Care Unit", t:"Preparation by the nursing staff for surgery: IV started, Wipe/Scrub, Surgical consent reviewed. Surgeon & Anesthesiologist visit, identify surgical site. Leave a contact phone number with nurse in ACU."},
      {n:"Surgery — the operation", t:"1-2 Hours for the operation only. In the OR 2-3 hours total."},
      {n:"Mako Robotic Surgery", t:"MAKO technology provides your surgeon with a patient-specific 3-D model to pre-plan your surgery. During surgery your surgeon guides MAKO's robotic-arm based on your specific plan. By selectively targeting just the damaged part of the joint, your surgeon can replace it while helping to spare the healthy bone and ligaments. It will be a discussion between you and the surgeon regarding this option in the office."},
      {n:"Surgery — Anesthesia", t:"Anesthesia types will be discussed with you by the anesthesiologist in the pre-surgery area: Spinal, “Twilight”, General Anesthetic, Nerve Blocks for Knee Replacements."},
      {n:"Anesthesia Side Effects", t:"Feeling sick in your stomach. Throwing up. A sore throat. Shaking or Chills. Dizziness. Trouble urinating. Headaches. Groggy. Delirium."},
      {n:"After Surgery — PACU", t:"Recovery Room: Typically 1 Hour. Wait for Spinal to end. Monitor Vital Signs. Drink fluids with head of bed up."},
      {n:"Patient Rooms", t:"Total joint center patient room located on the 3rd floor via elevator A."},
      {n:"Incentive Spirometer", t:"Will be taught and given in the hospital. Reduces Fevers. Prevents Pneumonia. Bring home for continued use."},
      {n:"Hospital Stay — Same Day Discharge", t:"Some patients have been identified by the surgeon and anesthesiologist to be appropriate for day of surgery discharge. Requirements: Medically stable. Have family/friend(s) to attend PT/OT session after surgery. Pain and Nausea managed. Good support system at home. Cleared by physical therapy and occupational therapy. Established safe discharge home. Medications for discharge confirmed. Transportation for home established once cleared for discharge. Please be patient with discharge nurse to get paperwork ready (might take about an hour)."},
      {n:"Hospital Stay — Post-Op Day 1", t:"For patients not discharged day of surgery. Regular diet. Drain removed if present. Pain management. Physical therapy 1-2x. Occupational therapy 1x. Total Joint Nurse Navigator visit to discuss discharge plans to home. Discontinue IV fluids. Anticipate discharge to home."},
      {n:"Hospital Stay — Post-Op Day 2", t:"For patients not discharged on post-op day 1. Pain management. Physical Therapy 1-2x. Occupational Therapy if needed. Verify equipment needs. Discharge Home."},
      {n:"Preventing Blood Clots", t:"Early Ambulation — out of bed day of surgery. Ankle pump exercises. Sequential Compression Device (SCD). Blood Thinner determined by MD: Arixtra, Lovenox injection (nursing will teach how to administer), Eliquis, Aspirin.", hw:"Compression socks everyday × 30 days. Only during the day. · Lovenox.com · Lovenox circled"},
      {n:"Constipation", t:"“A healthy colon is the gateway to a happy mind!” Cause: Dehydration, Narcotics, Immobility. Treatment: Increase fluids 3 days before surgery and continue after discharge, Mobility. Medications: Colace. Miralax (may begin 3-5 days before surgery; check with physician). MOM – Milk of Magnesia. Suppositories, Fleet enemas.", hw:"Black coffee · apricots · drink fluids"},
      {n:"Pain Management", t:"Icing 20 mins on and off with either ice pack (hip) or with ice machine (knee) — Not at night time. Elevate legs 20-30mins 4-5 times day — Not at night time. Take prescribed pain medication as needed every 4-6hrs. Premedicate 30 to 60 mins before PT or OT session in the hospital or at home. Stay hydrated — opioids tend to lower blood pressure."},
      {n:"Discharge Medications", t:"Narcotics – Discussed with you in MD office prior to surgery and confirmed prior to discharge from the hospital. Common medications for home include: Blood Thinner. Anti-inflammatories and/or narcotics. Bowel Medications. Nausea Medications. Return to Previous Medications — check with primary care physician if any changes should take place. For your education a medication brochure will be given to you while in the hospital which reviews medications purpose and potential side effects.", hw:"Tylenol 500 mg ATC · melox qd c food · Oxy q4° · One dose of anti bx post op"},
      {n:"Requirements for Discharge", t:"Tolerate regular diet. Maintain stable vital signs. Management of pain and bleeding. Increase independence with activity and mobility. Confirmed safe discharge plan with staff."},
      {n:"Physical Therapy", t:"Works on mobility such as walking with use of a walker, getting in/out of bed/chair, maneuvering up & down stairs. Therapists will also review cold therapy and elevation techniques which reduce swelling and pain."},
      {n:"Occupational Therapy", t:"Works with activities of daily living (ADL) such as dressing, grooming, bathing and assist with determining additional needed equipment.", hw:"cut up on the left, per my left side"},
      {n:"Front Wheeled Walker", t:"A front-wheeled walker is required; the four-wheeled rollator with a seat is crossed out. It will be provided to you after surgery if you don't have one. Please check with your insurance to see if it's covered. Medicare provides one walker every 5 years.", hw:"wrist height"},
      {n:"How to measure your walker", t:"Diagram showing walker handle height aligned with the wrist when standing with arms relaxed."},
      {n:"Equipment", t:"Toilet riser. Shower bench. Cryotherapy (ice machine) will be provided after surgery for all knee patients to keep it at home. Hospital provides ice packs to go home. Durable Medical Equipment mostly not covered by insurance.", hw:"fill with a case of 8 oz water bottles"},
      {n:"Occupational Therapy — optional equipment", t:"Optional equipment may be purchased before surgery: long-handled shoe horn, reacher/grabber, sock aid, long-handled sponge. OT can teach how to use. Not covered by insurance."},
      {n:"Positioning after Total Hip Replacement", t:"Your leg will be resting in a foam splint right after surgery. This will remind you not to cross your legs while in bed. Always put a pillow or two in between knees if you are a side sleeper or lying on your back.", note:"Hip only."},
      {n:"Total Hip Replacement — precautions", t:"Hip precautions for approximately 6 weeks post surgery: Don't bend at your hip past 90°. When sitting, ALWAYS keep your knees lower than your hips. Don't let your knee move inward past your navel. Don't turn your feet in or out. Do use pillows between your legs at night.", note:"Hip only."},
      {n:"Positioning after knee replacement", t:"YES: Keep operated leg straight and elevated when at rest. NO: no pillow under knee."},
      {n:"Discharge from the Hospital", t:"Discharge planning is coordinated between you, your physician, therapists and other clinical staff with recommendations of resources and needs post discharge. Care coordinator will help arrange for your discharge needs: Verify insurance coverage for services needed at discharge. Order durable medical equipment. Make referrals such as transportation home to assist if needed."},
      {n:"Home Health and Outpatient Therapy", t:"Agencies, coverage and copay dependent on individual insurance plans. Home health agency name and phone number will be provided before or after discharge to home. You will receive a call from the agency within 24-48 hours after discharge. Home physical therapy (PT) and occupational therapy (OT) will make an in home initial assessment and make a recommendation of treatment plan. PT typically 2-3 times per week for 1-2 weeks depending on assessment of needs and insurance coverage. OT typically one time visit. Outpatient Therapy: Some patients may go directly to outpatient therapy per surgeon recommendation, or participates after home health therapy and you are RESPONSIBLE setting up outpatient physical therapy appointment before surgery.", hw:"wash q hrs · elevate × 20 min × 6/day · ice · exercises · 650-367-5627 preop dept closes at 3:30"},
      {n:"Skilled Nursing Facility (SNF)", t:"If discharging home is not appropriate due to mobility or slow to progress, then skilled nursing will be an option. “Skilled care” is health care given when you need skilled nursing or rehabilitation staff to treat, manage, observe, and evaluate your care on a daily basis. Transportation to facility may or may not be covered by insurance — out of pocket costs approx $100-$200. Care Coordinator office: 650-367-5683."},
      {n:"Thank You — contacts", t:"Total Joint Patient Navigator, Gloria Kwok 650-482-6031. Care Coordination/Social Services 650-367-5683. Physical & Occupational therapy 650-367-5517. Main Hospital Operator 650-369-5811. Pre Operative Department 650-367-5545. Admitting Department 650-367-5551. Please ensure our admitting department has your correct phone number and address before coming to the hospital.", hw:"Gloria Kwok circled · closes at 4:30 · 650-367-5627 closes at 3:30"}
    ]},

  { id:"chk", tag:"CHK",
    name:"Patient Checklist, Knee FAQs & Pre-Op Timeline",
    who:"Sequoia Hospital / Dignity Health · 6 scanned pages",
    pages:[
      {n:"FAQ — sleeping positions", t:"In what positions can I sleep? We would like you to find a comfortable sleeping position that allows you to maintain your hip precautions. Make sure that when you are positioning yourself in bed that you do so carefully. You can sleep on your back, your stomach or your side (both surgical and nonsurgical). While on your side you should keep a pillow between your legs."},
      {n:"FAQ — how much to walk", t:"How much should I walk every day? General rule of thumb is at a minimum 1 block per day the first week, 2 blocks the second week, 3 blocks the third week. Each block ~250 feet. Can increase walking distance by 25-50% each week, not to exceed more than 2000 feet (or steps) the first two weeks after surgery. Let pain and swelling be a guide and get back to a desired walking distance at 6-12 weeks after surgery."},
      {n:"FAQ — bending the knee", t:"Does my knee need to be straight all the time? Can I sit with it bent? Yes, you can bend your knee. We actually encourage you to change the position of your knee frequently in order to decrease swelling and stiffness. You may find that your knee becomes stiff in any position after 20-30 minutes. While sitting we encourage you to perform your seated heel slides. When resting with your leg elevated we encourage you to keep your leg in a “neutral position” with your knee pointing towards the ceiling. Having a rolled towel or blanket on the outside of your leg acting as a barrier helps position it so it does not rotate out to the side. How much should I be bending my knee at home? 90 degrees of flexion by first post op visit with the surgeon — 10-20 days. Work on range of motion consistently (extension and flexion) and ensure adequate pain control, icing, and elevation to make this happen."},
      {n:"FAQ — exercises and therapists", t:"Should I do my exercises more frequently than prescribed by my PT? No. Please always follow the education and guidance provided by your therapy team. What if I hear conflicting information from different physical therapists? Confirm with your surgeon if you have any questions or concerns."},
      {n:"FAQ — walker, cane, stairs", t:"How long do I have to use the walker? The typical patient will use the walker for about 10 days post surgery. Home Health Therapy will work with you on when it is appropriate to transition to an alternative walking device (cane, hiking poles, crutches). Home health therapy will work on progressing you safely from the walker to a single point cane or hiking poles. When can I do stairs? If you have stairs at home the therapist in the hospital will practice them with you before you discharge."},
      {n:"FAQ — outdoors, hills, swimming, biking", t:"Walking outside right away, level surface with assist device. Home PT can support with low grade hills the first 2 weeks after surgery. Hold off on irregular surfaces and high grade hills until being cleared by your surgeon. Swimming once the incision is completely healed, likely 6 weeks, once cleared by the surgeon. Indoor biking right away, outdoor biking earliest 6 weeks once cleared by the surgeon."},
      {n:"FAQ — recovery time and follow-up", t:"How long does it take for people to recover? For Knee surgery, it usually takes about 6-8 weeks. This varies from patient to patient. What happens at the 10-20 days post op appointment? You will be seen by a physician assistant or nurse practitioner at the clinic in 10-14 days and he or she will assess your incision and remove stitches if indicated. You will see your surgeon about 6 weeks after discharge."},
      {n:"FAQ — icing and compression", t:"Why do they keep my cryo cuff on overnight at the hospital but I'm supposed to do 20 minutes on and 20 minutes off at home? Aim for 3-4 sessions of icing for knee replacement 30-60 minutes per day. You can do more than this if you desire, but be careful not to create ice burns on the skin. Many people can taper off icing around week 4-6, but this can be continued for 3 months or more if helpful. At the hospital they leave the ice on for convenience to the nursing staff. How long/often do I wear my compression stockings? You will wear your compression stockings for 3-4 weeks after discharge during daytimes only. You can wear your own compression stockings or those provided at the hospital. Remember not all surgeons prefer compression stockings."},
      {n:"FAQ — showering", t:"When can I shower? If you have an Optifoam (waterproof) dressing placed in the operating room, you may shower in 48 hrs. If you do not have the Optifoam dressing on when you leave the hospital, please change it to Optifoam at home (typically postop day 4), then you can shower after dressing change. It varies from surgeon to surgeon and not all surgeons prefer Optifoam dressing. If your surgeon prefers gauze dressing, please wrap around the dressing with press and seal or saran wrap before showering."},
      {n:"FAQ — driving", t:"When can I drive? If you have a left knee surgery done, it might take between 3-4 weeks. You need to be completely off narcotics (at least 24 hours) before you can drive. If you have a right knee surgery done, it might take between 4-6 weeks. You need to be completely off narcotics and be able to slam the brakes."},
      {n:"FAQ — home health visits", t:"How often does home health visit me? Who comes to my house? Home health agencies will contact you within 48 hours after discharge to schedule in-home visits and typically they will visit you 2-3 times a week for 2 weeks. Physical therapist and Occupational therapist are the ones who will visit you, sometimes a nurse will visit if needed or indicated before discharge. Who should I contact if no one calls me about Home therapy? If you don't hear from any home health agencies in 48 hours after discharge from hospital, please call our Care Coordination Office at 650-367-5683."},
      {n:"FAQ — outpatient PT and refills", t:"When should I start outpatient PT? For Knee surgery, please schedule outpatient physical therapy 3-4 weeks after discharge unless you are told differently by your surgeon. We highly encourage you to book Outpatient PT prior to surgery so the process is less stressful. It can be hard to secure a spot in some of the facilities. Who do I call with questions after I am discharged? You may either contact your surgeon's office or Gloria Kwok the Total Joint Patient Navigator at 650-482-6031. About medication refills, who do I call? Please contact your surgeon's office ahead of time before running low, especially pain medications. What's the average age of patients getting this procedure done? 65-66 years old in recent studies and registry reports (year 2020)."},
      {n:"Patient Checklist — 14 days before", t:"Anticipate to be discharged on the same day unless there are medical reasons or you are told to stay overnight. Arrange to have help at home for 5-10 days or consider hiring someone to help you until you can care for yourself. Invite to attend Rehab training in the hospital prior to discharge (this can be arranged once you are at Sequoia Hospital). Shop for groceries, have meals prepared and ready to eat. You may need help with groceries, meal prep and housekeeping for several weeks after surgery. Evaluate home for fall and trip hazards (remove loose carpets, throw rugs, cords). Pathways in home should be clear and wide enough for a walker at least 26 inches wide. Purchase equipment such as bedside commode, shower bench, reacher, hip kit (available on Amazon), basket for walker, etc. Arrange for transportation to and from the hospital. You are not allowed to take public transportation such as taxi, Uber or Lyft home alone."},
      {n:"Patient Checklist — 7 days, 5 days, night before", t:"7 Days Before: Stop taking blood thinners: non-steroidal anti-inflammatories, vitamins, herbal medications, supplements containing Vitamin E or Fish Oil, please consult with MD and/or Cardiologist. Stop shaving legs. 5 Days Before: Start taking a laxative, please consult with MD surgeon. Night Before Surgery: Wash body thoroughly with chlorhexidine soap (avoid scalp). Put on clean pajamas. Put clean sheets on your bed. No pets on bed (until cleared by MD). No food, gum or mints after midnight. Drink liquids to increase hydration (ie Ensure clear, Propel, water with electrolytes). May drink clear liquids up to 2 hours prior to arrival to hospital for surgery."},
      {n:"Patient Checklist — what to pack", t:"What to Pack For The Hospital: List of medications and which pharmacy you would like to use to refill prescriptions. Have access to credit card # and insurance card (picture in phone is helpful for reference). Toiletries including toothbrush, hearing aids & case, dental implants, eye glasses & case, durable medical equipment such as a CPAP. Wear hospital blue wrist band (given from Lab ONLY if you have blood draw from Sequoia hospital). Comfortable clothing (that allows for mobility), slip-on shoes. Entertainment such as books, magazines, iPad and charger, head phone, cell phone and charging cable and adapter. Copy of Advanced Healthcare Directive. What NOT to Pack: It is best not to bring any of your medications from home to the hospital. Any valuables such as jewelry, money, etc. If any questions or concerns please feel free to contact Gloria Kwok Total Joint Patient Navigator 650-482-6031."},
      {n:"Commonly Asked Questions", t:"How many days am I in the hospital? We encourage the large majority of our patients to go home the same day that their surgery takes place, and most do! Occasionally, patients need to stay overnight in the hospital. Your surgery is an individualized journey. Your surgeon and care team will decide the best plan for discharge based on your procedure, health and return to safe mobility. Do I need help at home? YES, everyone needs a helper or coach to be with them for the first 3-5 days to help with cleaning, laundry, meals, pain management, ice for surgical site, safety, driving needs etc. Your helper/coach is encouraged to join a PT/OT session while you are here in the hospital to understand your needs at home. This can be arranged once you have arrived. Do I need to arrange Home Health therapy at home? No, the Home Physical & Occupational therapy is arranged by the surgeon's office or the Care Coordination department at Sequoia Hospital if not prearranged by the surgeon's office before surgery. You need to arrange your own appointments for Outpatient Therapy which is your choice of location often close to home. What equipment do I need prior to surgery? If you have a front wheel walker please feel free to bring it in after surgery and the Physical Therapist here can make sure it is the correct height. Otherwise we can provide a walker for home provided at the hospital prior to discharge and we will bill your insurance. Please purchase a bedside commode, elevated toilet seat, long handle grabber, sock aid, etc. if you feel it will be helpful for your recovery. Should I bring anything to the hospital? Copy of insurance prescription card. Copy of credit card or access to credit card #. iPad, laptop, cell phone along with charging cord. Books, adult coloring book. Robe, comfortable shoes to wear during therapy sessions. You are given a toothbrush, toothpaste, notepad, pen, eye mask."},
      {n:"Pre-Op Patient Timeline / To-Do List", t:"Start as soon as possible: Start taking supplements. Vitamin D: 1000 units/day and Natural Yogurt: one cup/day before surgery. 1 month (30 days) before surgery: Lab work should be done 20-30 days before surgery. Results must be submitted to your Primary Care Physician and your Total Joint Surgery office. Your pre-op appointment with your Primary Care Physician must be within 30 days of your surgery date, after lab work is completed. Please check with your Primary Care Physician what medications can be taken with a small sip of water on the day of surgery. Please remember to bring your “Pre-operative Physical Clearance Request Form” included in this folder to your pre-op appointment. Make sure to schedule outpatient PT. For the knees, schedule 3 weeks after surgery. For the hip, schedule 5 weeks after surgery. Make sure to schedule ahead. 3 weeks before surgery: Call Sequoia Hospital's Pre-Admit Clinic at (650) 367-5545 to schedule your pre-admit appointment. Refer to “Your Passport to Sequoia Hospital” insert in folder. This appointment is to have your blood typed, review paperwork, and receive a special sponge for cleansing prior to surgery. 1 week before surgery: Stop taking all anti-inflammatory medication (Advil, Celebrex, Mobic, Aleve, Aspirin, etc). If you are on Plavix, Coumadin, or Prednisone, please consult with your Primary Care Physician. Tylenol is okay to continue taking. Please start taking Miralax one week before surgery date. If you experience loose stools, stop taking. 3 days before surgery: Stop shaving body hair. Okay to continue shaving facial hair. Night before surgery: Bathe with the chlorhexidine soap provided by Sequoia the night before AND the morning of surgery. Nothing to eat after midnight. Clear liquids (water, clear broth, apple juice, black coffee, Gatorade) may be consumed until 4 hours before your scheduled surgery time. Sequoia Hospital will call you the night before your surgery for the exact surgery time. (If you are scheduled on a Monday, Sequoia will call on Friday). Morning of surgery: Bathe with the chlorhexidine soap. Certain medications may need to be taken with a small sip of water (contact your Primary Care Physician ahead of time to find out if you are taking any of these medications). Stop all food and drink, including water, 4 hours before your scheduled surgery time. Arrive at the hospital 2 hours before your scheduled surgery time.",
       hw:"started 8/22 · after 8/1/26, redraw between 8/1 and 8/14 · 8/12 · 9/22-24-29 & 10/1 · 8/10/26 · 8/24 ★ · 8/27 · night before 9/30 [should read 8/30] · 8/31 · circled “until 4 hours”, “4 hours before your scheduled surgery time”, “2 hours”"}
    ]}
];

function renderDocs(){
  const host = document.getElementById("p-docs");
  host.innerHTML =
    '<div class="block"><h2>The documents you were given</h2>' +
    '<p class="lede">Everything from the three folders, page by page, in the order the pages come. Printed text and your handwritten notes are kept apart so it is always clear which is which.</p>' +
    '<p class="prov"><b>These are transcriptions, not the scans.</b> The PDFs are 67 MB across three files and cannot live inside this page. Every word here was read off your scans and typed out; the paper originals remain the record if anything ever looks wrong.</p></div>' +
    '<div class="searchwrap" style="padding:0 0 .7rem">' +
      '<input id="dq" class="search" type="search" autocomplete="off" aria-label="Filter the documents" ' +
      'placeholder="Filter these pages — walker, Miralax, shaving…">' +
      '<button id="dqx" class="qx" hidden aria-label="Clear the filter" style="right:.45rem">✕</button>' +
    '</div>' +
    '<p class="dcount" id="dcount"></p>' +
    '<div id="doclist"></div>';
  renderDocList("");
}

function renderDocList(q){
  const term = (q || "").trim().toLowerCase();
  let shown = 0, total = 0;
  const html = DOCS.map(function(d){
    const pages = d.pages.filter(function(p){
      total++;
      if(!term) return true;
      return (p.n + " " + p.t + " " + (p.hw||"") + " " + (p.note||"") + " " + d.name + " " + d.tag)
        .toLowerCase().indexOf(term) > -1;
    });
    shown += pages.length;
    if(!pages.length) return "";
    return '<section class="doc"><div class="doc-h"><span class="doc-tag">' + esc(d.tag) + '</span>' +
      '<div><h3>' + esc(d.name) + '</h3><span class="doc-who">' + esc(d.who) + '</span></div></div>' +
      pages.map(function(p){
        return '<article class="dpage"><h4>' + hl(p.n, term) + '</h4>' +
          '<p class="dtext">' + hl(p.t, term) + '</p>' +
          (p.hw ? '<div class="hand"><span class="lbl">Your handwriting on this page</span><q>' + esc(p.hw) + '</q></div>' : '') +
          (p.note ? '<p class="dnote">' + esc(p.note) + '</p>' : '') +
        '</article>';
      }).join("") + '</section>';
  }).join("");

  document.getElementById("doclist").innerHTML = html ||
    '<p class="rnone">No page mentions “' + esc(q) + '”. Try a shorter word — this filter looks at every page of all three documents, including your handwriting.</p>';
  document.getElementById("dcount").textContent = term
    ? shown + " of " + total + " pages mention “" + q.trim() + "”"
    : total + " pages across " + DOCS.length + " documents";
}

document.addEventListener("input", function(e){
  if(!e.target.closest("#dq")) return;
  const v = document.getElementById("dq").value;
  document.getElementById("dqx").hidden = !v;
  renderDocList(v);
});
document.addEventListener("click", function(e){
  if(!e.target.closest("#dqx")) return;
  document.getElementById("dq").value = "";
  document.getElementById("dqx").hidden = true;
  renderDocList("");
  document.getElementById("dq").focus();
});

      g.list.map(c => '<a class="call" href="tel:' + c.t.replace(/-/g,"") + '">' +
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .3 1.9.7 2.8a2 2 0 0 1-.5 2.1L8.1 9.9a16 16 0 0 0 6 6l1.3-1.2a2 2 0 0 1 2.1-.5c.9.4 1.8.6 2.8.7a2 2 0 0 1 1.7 2z"/></svg>' +
        '<span class="who"><b>' + esc(c.n) + '</b>' + (c.d?'<span>'+esc(c.d)+'</span>':'') + '</span>' +
        '<span class="num">' + esc(c.t) + '</span></a>').join("") + '</div></div>').join("") +
    '<div class="block"><span class="eyebrow">Add this to your home screen</span>' +
    '<p class="prov">On an iPhone: open this page in Safari, tap the Share button, then “Add to Home Screen.” It then opens like an app, and your check marks are saved on that device.</p></div>';

function renderHead(){
  const t = offsetToday();
  const cEl = document.getElementById("count");
  if(t < 0) cEl.innerHTML = Math.abs(t) + '<small>' + (Math.abs(t)===1?" day to go":" days to go") + '</small>';
  else if(t === 0) cEl.innerHTML = 'Today<small> — surgery day</small>';
  else cEl.innerHTML = t + '<small>' + (t===1?" day after surgery":" days after surgery") + '</small>';

  const all = PHASES.flatMap(p=>p.items).filter(i=>!i.x).map(i=>i.key)
    .concat(tasks.map(t=>"u:"+t.id));
  document.getElementById("meta").innerHTML = '<b>' + fmtL(SURGERY) + '</b><br>' + SIDE +
    ' total knee replacement<br><b>' + all.filter(k=>done[k]).length + ' of ' + all.length + '</b> checked off';

  const lo = PHASES[0].from, hi = PHASES[PHASES.length-1].to;
  const pct = v => ((Math.min(Math.max(v,lo),hi)-lo)/(hi-lo))*100;
  document.getElementById("railfill").style.width = pct(t)+"%";
  document.getElementById("railnow").style.left  = pct(t)+"%";
  document.getElementById("railpivot").style.left= pct(0)+"%";
  document.getElementById("chips").innerHTML = PHASES.map(p =>
    '<button class="chip" data-go="ph-'+p.id+'" data-state="'+phaseState(p)+'">'+esc(p.short)+'</button>').join("");
}

function show(id){
  document.querySelectorAll(".panel").forEach(p=>p.classList.toggle("on", p.id === "p"+"-"+id));
  document.querySelectorAll("#tabs button").forEach(b=>b.setAttribute("aria-selected", b.dataset.tab===id));
  window.scrollTo({top:0, behavior:"instant"});
}

document.getElementById("tabs").addEventListener("click", e => {
  const b = e.target.closest("button[data-tab]"); if(b) show(b.dataset.tab);
});
document.getElementById("chips").addEventListener("click", e => {
  const b = e.target.closest("[data-go]"); if(!b) return;
  show("timeline");
  document.querySelectorAll("#chips .chip").forEach(c => c.classList.toggle("sel", c === b));
  document.getElementById("chips").classList.add("has-sel");
  const el = document.getElementById(b.dataset.go);
  if(el){ el.dataset.open="1"; el.querySelector(".ph-head").setAttribute("aria-expanded","true");
    requestAnimationFrame(()=>el.scrollIntoView({behavior:"smooth",block:"start"})); }
});
/* add / delete her own tasks */
document.getElementById("p-timeline").addEventListener("click", e => {
  const blk = document.querySelector("#p-timeline .addblk");
  if(e.target.closest(".add-open")){
    blk.querySelector(".addform").hidden = false;
    blk.querySelector(".add-open").hidden = true;
    blk.querySelector(".t-text").focus(); return;
  }
  if(e.target.closest(".add-cancel")){
    blk.querySelector(".addform").hidden = true;
    blk.querySelector(".add-open").hidden = false;
    blk.querySelector(".addmsg").textContent = ""; return;
  }
  if(e.target.closest(".add-save")){
    const text = blk.querySelector(".t-text").value.trim();
    const date = blk.querySelector(".t-date").value;
    const time = blk.querySelector(".t-time").value;
    const msg  = blk.querySelector(".addmsg");
    if(!text){ msg.textContent = "Give the task a name first."; blk.querySelector(".t-text").focus(); return; }
    if(!date){ msg.textContent = "Pick a date so it knows where to sit on the timeline."; return; }
    tasks.push({ id: String(Date.now()) + "-" + Math.floor(Math.random()*1e6), text, date, time: time || "" });
    saveTasks();
    const t = tasks[tasks.length-1], ph = taskPhase(t);
    renderTimeline(); renderHead(); renderBanner();
    const el = document.getElementById("ph-" + ph);
    if(el){ el.dataset.open = "1"; el.querySelector(".ph-head").setAttribute("aria-expanded","true");
      requestAnimationFrame(()=>el.scrollIntoView({behavior:"smooth",block:"start"})); }
    return;
  }
  const del = e.target.closest("[data-del]");
  if(del){
    const t = tasks.find(x => x.id === del.dataset.del);
    if(t) askConfirm("Delete this task?", "“" + t.text + "” will be removed, along with any note on it. Nothing else is affected.",
      "Delete", () => {
        tasks = tasks.filter(x => x.id !== del.dataset.del);
        delete done["u:" + del.dataset.del];
        delete notes["n:item:u:" + del.dataset.del];
        saveTasks(); save(); saveNotes(); renderTimeline(); renderHead(); renderBanner();
      });
    return;
  }

  const head = e.target.closest(".ph-head");
  if(head){ const ph=head.closest(".phase"); const open = ph.dataset.open==="1"?"0":"1";
    ph.dataset.open=open; head.setAttribute("aria-expanded", open==="1"?"true":"false"); return; }
  const row = e.target.closest("button.row");
  if(row){
    const li = row.closest("li.item");
    if(li && li.dataset.key) toggleItem(li.dataset.key);
    return;
  }
});

document.getElementById("p-daily").addEventListener("click", e => {
  const b = e.target.closest("[data-trk]"); if(!b) return;
  const k = b.dataset.trk;
  done[k]=!done[k]; if(!done[k]) delete done[k]; save();
  b.setAttribute("aria-checked", !!done[k]);
  /* stamp the moment a medication dose is ticked; drop it when un-ticked */
  if(!b.dataset.ses){
    const rid = k.split(":")[2];
    const row = TRACK.flatMap(g=>g.rows).find(x=>x.id===rid);
    if(row && row.every){
      if(done[k]) times[k] = Date.now(); else delete times[k];
      saveTimes();
      const trow = b.closest(".trow");
      const d = +b.dataset.day;
      const holder = trow.querySelector(".dts"), cap = trow.querySelector(".cap"), due = trow.querySelector(".due");
      const fresh = document.createElement("div");
      fresh.innerHTML = doseTimesHTML(d,row);
      if(holder) holder.remove(); if(cap) cap.remove(); if(due) due.remove();
      const slots = trow.querySelector(".slots");
      while(fresh.firstChild) slots.after(fresh.firstChild);
      refreshDue();
    }
  }
  const sec = b.closest(".day"); if(!sec) return;
  const el = sec.querySelector(".tally"); if(!el) return;
  if(b.dataset.ses){                                   // a therapy session step
    const g = SESSIONS.find(x => x.id === b.dataset.ses), refs = sesRefs(g);
    const c = refs.filter(r => done[sesKey(g.id,r,"did")]).length;
    el.textContent = c+"/"+refs.length; el.classList.toggle("full", c===refs.length);
  } else {                                             // a daily dose or exercise
    const [c,n] = dayTally(+b.dataset.day);
    el.textContent = c+"/"+n; el.classList.toggle("full", c===n);
  }
});
/* The floating button is the only always-visible route to the task form. */
document.getElementById("fab").addEventListener("click", () => {
  show("timeline");
  const blk = document.querySelector("#p-timeline .addblk");
  if(!blk) return;
  blk.querySelector(".addform").hidden = false;
  blk.querySelector(".add-open").hidden = true;
  blk.querySelector(".addmsg").textContent = "";
  requestAnimationFrame(() => {
    blk.scrollIntoView({behavior:"smooth", block:"start"});
    blk.querySelector(".t-text").focus();
  });
});

document.getElementById("theme").addEventListener("click", () => {
  const cur = document.documentElement.getAttribute("data-theme");
  const dark = cur ? cur==="dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
  document.documentElement.setAttribute("data-theme", dark ? "light" : "dark");
});
